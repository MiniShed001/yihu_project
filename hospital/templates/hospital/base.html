{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}医院业务系统{% endblock %}</title>
<style>
  :root{--bg:#f4f7f6;--card:#fff;--ink:#1a2321;--mut:#68757a;--acc:#0e7c66;
        --acc2:#0a5c4c;--line:#e2e9e7;--warn:#b45309;--danger:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(135deg,#0a5c4c,#0e7c66);color:#fff;padding:16px 28px}
  header h1{margin:0;font-size:1.3rem;font-weight:600}
  header p{margin:4px 0 0;font-size:.8rem;opacity:.85}
  nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
      gap:2px;padding:0 18px}
  nav a{display:block;padding:11px 15px;color:var(--ink);text-decoration:none;font-size:.95rem;
        border-bottom:2px solid transparent}
  nav a:hover,nav a.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:22px 20px}
  h2{font-size:1.12rem;margin:26px 0 12px;border-left:4px solid var(--acc);padding-left:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px;text-align:center}
  .stat .num{font-size:1.7rem;font-weight:700;color:var(--acc)}
  .stat .lbl{font-size:.8rem;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--card)}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f0f6f4;color:var(--mut);font-weight:600;white-space:nowrap}
  .muted{color:var(--mut)}
  .tag{display:inline-block;font-size:.72rem;border-radius:20px;padding:1px 9px}
  .tag.waiting{background:#fff4e0;color:#9a5b00}
  .tag.done{background:#e3f4ec;color:#0a6b52}
  .tag.cancelled{background:#fbeaea;color:#a11}
  .badge{display:inline-block;font-size:.72rem;background:#eef4fb;color:#0b6bcb;
         border-radius:20px;padding:1px 9px;margin-left:6px}
  form.card label{display:block;font-size:.82rem;color:var(--mut);margin:8px 0 2px}
  form.card input,form.card select,form.card textarea{width:100%;padding:7px 9px;
      border:1px solid var(--line);border-radius:7px;font-size:.92rem;font-family:inherit}
  form.card .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .btn{display:inline-block;background:var(--acc);color:#fff;border:none;border-radius:7px;
       padding:8px 16px;font-size:.9rem;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--acc2)}
  .btn.small{padding:3px 10px;font-size:.78rem}
  .btn.warn{background:#d97706}.btn.warn:hover{background:#b45309}
  .btn.danger{background:#dc2626}.btn.danger:hover{background:#b91c1c}
  .msgs{list-style:none;padding:0;margin:12px 0}
  .msgs li{background:#e3f4ec;border:1px solid #bfe3d3;color:#0a6b52;border-radius:8px;
           padding:9px 14px;margin-bottom:6px;font-size:.88rem}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.two-col{grid-template-columns:1fr}}
  footer{max-width:1180px;margin:0 auto;padding:18px;color:var(--mut);font-size:.78rem}
  .empty{padding:20px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>医院业务系统 <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">Django + SQLite</span></h1>
  <p>科室 · 医生 · 患者 · 挂号 · 就诊记录 —— 小型演示系统</p>
</header>
<nav>
  <a href="{% url 'hospital:index' %}" {% if request.resolver_match.url_name == 'index' %}class="active"{% endif %}>总览</a>
  <a href="{% url 'hospital:departments' %}" {% if request.resolver_match.url_name == 'departments' %}class="active"{% endif %}>科室</a>
  <a href="{% url 'hospital:doctors' %}" {% if request.resolver_match.url_name == 'doctors' %}class="active"{% endif %}>医生</a>
  <a href="{% url 'hospital:patients' %}" {% if request.resolver_match.url_name == 'patients' %}class="active"{% endif %}>患者</a>
  <a href="{% url 'hospital:registrations' %}" {% if request.resolver_match.url_name == 'registrations' or request.resolver_match.url_name == 'registration_action' %}class="active"{% endif %}>挂号</a>
  <a href="{% url 'hospital:records' %}" {% if request.resolver_match.url_name == 'records' %}class="active"{% endif %}>就诊记录</a>
</nav>
<main>
{% if messages %}
<ul class="msgs">
  {% for m in messages %}<li>{{ m }}</li>{% endfor %}
</ul>
{% endif %}
{% block content %}{% endblock %}
</main>
<footer>医院业务系统 —— 测试数据仅供演示,不含真实患者信息。</footer>
</body>
</html>
